name: Deploy

# Builds the Next.js app on every push to main that changes web/**,
# and publishes a ready-to-run release to the "deploy" branch.
# The server only pulls that branch — it never builds anything.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'   # so fixes to this file re-run it too
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Used by the database-backed tests (Vitest skips them when unset)
      DATABASE_URL: mysql://pykk:pykk-ci-test@127.0.0.1:3306/pykk

    # A throwaway database so the daily-job idempotency tests run in CI too
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_DATABASE: pykk
          MYSQL_USER: pykk
          MYSQL_PASSWORD: pykk-ci-test
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Reads the pnpm version from the packageManager field in this file
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Override with a repo variable named NODE_VERSION (Settings → Secrets and variables → Actions → Variables)
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate the test database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build (standalone)
        run: pnpm build

      - name: Bundle server scripts (migrate + create-admin)
        run: pnpm bundle:server

      - name: Install the e2e browser
        run: npx playwright install chromium

      - name: End-to-end test (pay page)
        env:
          BASE_URL: http://localhost:4577
          ADMIN_EMAIL: e2e@pykk.uk
          ADMIN_PASSWORD: e2e-password-123
          CRON_SECRET: e2e-cron-secret
          # same single-host fallback as production, or /pay/* 404s in middleware
          PUBLIC_APP_HOST: admin.pykk.uk
        run: |
          rm -rf /tmp/e2e-app && mkdir /tmp/e2e-app
          cp -r .next/standalone/. /tmp/e2e-app/
          mkdir -p /tmp/e2e-app/.next
          cp -r .next/static /tmp/e2e-app/.next/static
          cp deploy/start.js deploy/migrate.mjs deploy/create-admin.mjs /tmp/e2e-app/
          cp -r drizzle /tmp/e2e-app/drizzle
          echo "e2e" > /tmp/e2e-app/VERSION.txt
          cd /tmp/e2e-app
          node migrate.mjs
          printf 'e2e-password-123\ne2e-password-123\n' | node create-admin.mjs --email "$ADMIN_EMAIL"
          PORT=4577 node start.js &
          sleep 6
          cd "$GITHUB_WORKSPACE/web"
          node e2e/pay-page.test.mjs

      - name: Assemble the release folder
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf release
          mkdir release

          # The standalone server (server.js + its minimal node_modules)
          if [ -f web/.next/standalone/server.js ]; then
            cp -R web/.next/standalone/. release/
          else
            # Nested layout (happens in some monorepo setups)
            cp -R web/.next/standalone/web/. release/
            cp -R web/.next/standalone/node_modules release/node_modules 2>/dev/null || true
          fi

          # Static assets and public files the standalone build leaves out
          mkdir -p release/.next
          cp -R web/.next/static release/.next/static
          if [ -d web/public ]; then cp -R web/public release/public; fi

          # Launcher, plus optional server tools (added in later phases — copied when present)
          cp web/deploy/start.js release/start.js
          if [ -f web/deploy/migrate.mjs ]; then cp web/deploy/migrate.mjs release/migrate.mjs; fi
          if [ -d web/drizzle ]; then cp -R web/drizzle release/drizzle; fi
          if [ -f web/deploy/create-admin.mjs ]; then cp web/deploy/create-admin.mjs release/create-admin.mjs; fi

          # Keeps the server's own .env and tmp/ out of git's way on the deploy branch
          printf '.env\ntmp/\n' > release/.gitignore

          # Version stamp: commit hash on line 1, build time on line 2
          git rev-parse --short HEAD > release/VERSION.txt
          date -u +%Y-%m-%dT%H:%M:%SZ >> release/VERSION.txt

          ls -la release

      - name: Publish the release to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release
          publish_branch: deploy
          commit_message: 'Deploy ${{ github.sha }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
